# Kiểm tra mỗi lần đẩy mã lên: chạy thử logic, đóng gói giao diện, biên dịch phần Rust trên Windows.
name: Kiểm tra

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  giao-dien:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Kiểm tra kiểu dữ liệu (chỉ cảnh báo)
        run: npm run typecheck
        continue-on-error: true

  windows:
    runs-on: windows-latest
    needs: giao-dien
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Biên dịch và chạy kiểm thử Rust
        working-directory: src-tauri
        env:
          HEDU_REPO: ${{ github.repository }}
        run: cargo test --lib --locked
