[package]
name = "hedu"
version = "0.1.0"
description = "HEdu: soạn thảo Toán, ngân hàng câu hỏi LaTeX, tạo đề"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hedu_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
# Lớp AI dùng chung (ai.rs): HTTPS giống plugin cập nhật (reqwest 0.13 + rustls/ring), khoá trong Windows Credential Manager
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"

# E2a: Job Object để huỷ cả cây tiến trình TeX trên Windows (đã có trong Cargo.lock qua các phụ thuộc khác)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
