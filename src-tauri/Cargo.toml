[package]
name = "hedu"
version = "0.1.0"
description = "HEdu: soạn thảo Toán, ngân hàng câu hỏi LaTeX, tạo đề"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hedu_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Lớp AI dùng chung (ai.rs): HTTPS giống plugin cập nhật (reqwest 0.13 + rustls/ring), khoá trong Windows Credential Manager
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
